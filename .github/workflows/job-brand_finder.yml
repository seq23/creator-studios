# Brand finder + public contact finder (section 12b), weekly from the Monday cron lane or "Find brands now". Started ONLY by the Worker (repository_dispatch with a signed payload); the job
# fetches its spec from the Worker, works in the runner, writes files back through the Worker, calls back.
# Logs show step names, counts and pass/fail only (section 13).
name: job-brand_finder

on:
  repository_dispatch:
    types: [brand_finder]

concurrency:
  group: job-brand_finder-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -q -r jobs/requirements.txt
      - name: Run
        run: python3 jobs/brand_finder.py
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_NONCE: ${{ github.event.client_payload.nonce }}
          JOB_TS: ${{ github.event.client_payload.ts }}
          JOB_SIG: ${{ github.event.client_payload.sig }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
          RUN_ID: ${{ github.run_id }}
          # Which studio started this job: it picks that studio's shared secret (JOB_SHARED_SECRET_<SLUG>, or
          # JOB_SHARED_SECRET in a studio's own job repository). Storage and keys come through that Worker's signed spec.
          JOB_STUDIO: ${{ github.event.client_payload.studio }}
          JOB_SHARED_SECRET: ${{ secrets[format('JOB_SHARED_SECRET_{0}', github.event.client_payload.studio)] || secrets.JOB_SHARED_SECRET }}
          # Keys normally come from the signed spec (she pastes them in Connect accounts); these
          # repository secrets are only a fallback for the builder's test account.
