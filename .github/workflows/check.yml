# Merge gate: under 5 minutes. Typecheck, unit tests, validators, build, and the shipped-bundle scan
# (no host identifier in what every studio serves). The long suites (Playwright e2e) run post-merge
# (e2e.yml, nightly); a green run of this on main deploys every studio (deploy.yml).
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # by hand, on any branch

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Shipped bundle carries no host identifier (guard a)
        run: node scripts/bundle-scan.mjs
      - name: Python job syntax
        run: python3 -m py_compile jobs/*.py
      - name: ffmpeg (the full-video job's tests run it on synthetic footage)
        # A static ffmpeg from GitHub releases, not apt: 7 Oct 2026 the runners' apt mirror hung for 8
        # minutes, then refused twice with timeouts, and the gate went red with no code at fault.
        # 22 Oct 2026: FedericoCarboni/setup-ffmpeg@v3 broke upstream ("Failed to read version from
        # readme") and turned the gate red with no code at fault. Now: the static BtbN build from
        # GitHub releases (no apt), falling back to the bounded apt installer if that download fails.
        timeout-minutes: 6
        run: |
          set -uo pipefail
          if curl -fsSL --retry 3 --max-time 180 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            && mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1; then
            echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            echo "static ffmpeg download failed; using apt"
            bash .github/scripts/apt-install.sh ffmpeg
          fi
      - name: Python job tests (web search + page reading, keyless and Firecrawl; the voice batch; the full video kept whole)
        run: python3 -m unittest discover -s jobs/tests -v
