# A full video for YouTube (the third door on Dump). Started ONLY by the Worker (repository_dispatch with a signed
# payload); the job fetches its spec from the Worker, copies the video whole (no cutting, no 9:16), writes what she said
# and three thumbnail frames back through the Worker, calls back. Logs show step names, counts and pass/fail only.
name: job-fullvideo

on:
  repository_dispatch:
    types: [fullvideo]

concurrency:
  group: job-fullvideo-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

env:
  JOB_HEAVY: "1"          # fullvideo.py installs faster-whisper for the transcript
  WHISPER_MODEL: base
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    # A long video: download, copy, transcribe on CPU (about a third of its length), upload. 120 min
    # is a fault detector (~4x a 30-minute video), never a budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
      - name: System tools
        run: bash .github/scripts/apt-install.sh ffmpeg
      - run: pip install -q -r jobs/requirements.txt
      - name: Run
        run: python3 jobs/fullvideo.py
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_NONCE: ${{ github.event.client_payload.nonce }}
          JOB_TS: ${{ github.event.client_payload.ts }}
          JOB_SIG: ${{ github.event.client_payload.sig }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
          RUN_ID: ${{ github.run_id }}
          # Which studio started this job: it picks that studio's shared secret (JOB_SHARED_SECRET_<SLUG>, or
          # JOB_SHARED_SECRET in a studio's own job repository). Storage and keys come through that Worker's signed spec.
          JOB_STUDIO: ${{ github.event.client_payload.studio }}
          JOB_SHARED_SECRET: ${{ secrets[format('JOB_SHARED_SECRET_{0}', github.event.client_payload.studio)] || secrets.JOB_SHARED_SECRET }}
