# The photo maker (jobs/photopack.py): one set of photos → a slow-zoom reel, a before/after, a
# carousel, with faces and house numbers blurred. The `run` job is started ONLY by a studio's Worker
# (repository_dispatch with a signed payload); it fetches its photos from that Worker and writes the
# pieces back through it. Logs show step names and counts only.
#
# The `selftest` job runs the same pipeline on made-up photos (a house number must come back blurred)
# when the photo maker changes. It uses no secrets and never talks to a Worker.
name: job-photopack

on:
  repository_dispatch:
    types: [photopack]
  pull_request:
    paths:
      - jobs/photopack.py
      - .github/workflows/job-photopack.yml
  workflow_dispatch:

concurrency:
  group: job-photopack-${{ github.event.client_payload.job_id || github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30    # fault detector (~4x a ten-photo pack), never a budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - name: System tools (ffmpeg, tesseract for house numbers, a bold font for Before/After)
        run: bash .github/scripts/apt-install.sh ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install -q -r jobs/requirements.txt pillow pillow-heif "opencv-python-headless>=4.8,<5" numpy
      - name: Run
        run: python3 jobs/photopack.py
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_NONCE: ${{ github.event.client_payload.nonce }}
          JOB_TS: ${{ github.event.client_payload.ts }}
          JOB_SIG: ${{ github.event.client_payload.sig }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
          RUN_ID: ${{ github.run_id }}
          # Which studio started this job: it picks that studio's shared secret (JOB_SHARED_SECRET_<SLUG>, or
          # JOB_SHARED_SECRET in a studio's own job repository). Storage comes through that Worker's signed spec.
          JOB_STUDIO: ${{ github.event.client_payload.studio }}
          JOB_SHARED_SECRET: ${{ secrets[format('JOB_SHARED_SECRET_{0}', github.event.client_payload.studio)] || secrets.JOB_SHARED_SECRET }}

  selftest:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15    # fault detector (~4x a normal run), never a budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools
        run: bash .github/scripts/apt-install.sh ffmpeg tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install -q pillow pillow-heif "opencv-python-headless>=4.8,<5" numpy
      - name: Photo maker self-test (made-up photos, no secrets)
        run: python3 jobs/photopack.py --selftest
