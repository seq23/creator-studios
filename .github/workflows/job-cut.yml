# Cut a dump into clips (section 8). The `run` job is started ONLY by the Worker (repository_dispatch with a signed
# payload); it fetches its spec and inputs from the Worker, works in the runner, writes clips back through the Worker, calls back.
# Logs show step names, counts and pass/fail only (section 13).
#
# The `selftest` job runs the same pipeline on synthetic footage (jobs/selftest_cut.py) when the pipeline changes.
# It uses no secrets and never talks to the Worker, so running it on pull requests is safe.
name: job-cut

on:
  repository_dispatch:
    types: [cut]
  pull_request:
    paths:
      - jobs/cut.py
      - jobs/looks.py
      - jobs/looks.json
      - jobs/common.py
      - jobs/selftest_cut.py
      - .github/workflows/job-cut.yml
  workflow_dispatch:

concurrency:
  group: job-cut-${{ github.event.client_payload.job_id || github.ref }}
  cancel-in-progress: false

env:
  JOB_HEAVY: "1"          # cut.py installs faster-whisper (and MediaPipe if it installs within a minute)
  WHISPER_MODEL: base
  GLOG_minloglevel: "2"   # MediaPipe's native logging: errors only
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  run:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobs/requirements.txt
            jobs/cut.py
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
      - name: System tools
        # tesseract: the watermark check (whose video is this?). libgles2 + libegl1: MediaPipe's Linux wheel loads GLES/EGL even for CPU face detection
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libgles2 libegl1 tesseract-ocr tesseract-ocr-eng > /dev/null
      - run: pip install -q -r jobs/requirements.txt
      - name: Run
        run: python3 jobs/cut.py
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          JOB_NONCE: ${{ github.event.client_payload.nonce }}
          JOB_TS: ${{ github.event.client_payload.ts }}
          JOB_SIG: ${{ github.event.client_payload.sig }}
          WORKER_URL: ${{ github.event.client_payload.worker_url }}
          RUN_ID: ${{ github.run_id }}
          # Which studio started this job: it picks that studio's shared secret (JOB_SHARED_SECRET_<SLUG>, or
          # JOB_SHARED_SECRET in a studio's own job repository). Storage and keys come through that Worker's signed spec.
          JOB_STUDIO: ${{ github.event.client_payload.studio }}
          JOB_SHARED_SECRET: ${{ secrets[format('JOB_SHARED_SECRET_{0}', github.event.client_payload.studio)] || secrets.JOB_SHARED_SECRET }}

  selftest:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35    # fault detector (~4x a normal run: the dump runs plus every Look twice), never a budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobs/requirements.txt
            jobs/cut.py
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
      - name: System tools (ffmpeg with libass; GLES/EGL for MediaPipe; espeak-ng for a spoken sample)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libgles2 libegl1 espeak-ng > /dev/null
      - name: Pipeline self-test (synthetic footage, no secrets; the Looks run in selftest-looks)
        run: python3 jobs/selftest_cut.py --require-heavy --skip-looks

  # Every Look rendered and checked (jobs/looks.json), in two halves side by side so the PR gate
  # stays short. Only ffmpeg with libass is needed: no whisper, no MediaPipe (JOB_HEAVY off).
  selftest-looks:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30    # fault detector (~4x a normal run), never a budget
    strategy:
      fail-fast: false
      matrix:
        kind: [single, grid]
    env:
      JOB_HEAVY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools (ffmpeg with libass)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Every Look (${{ matrix.kind }}), rendered and checked
        run: python3 jobs/selftest_cut.py --looks-only --looks-kind ${{ matrix.kind }} --require-libass
